name: SemVerge
description: "Release-readiness automation for GitHub: version, prepare, communicate, and publish dependable releases."
author: Evan Gribar
branding:
  color: blue
  icon: package
inputs:
  github-token:
    description: GitHub token used to read the repository and publish release changes.
    required: false
    default: ${{ github.token }}
  config:
    description: Optional SemVerge configuration file. Defaults to .semverge.yml when present.
    required: false
    default: .semverge.yml
  prerelease:
    description: Optional prerelease channel, such as beta or rc.
    required: false
  artifact-command:
    description: Optional command that produces release artifacts in the runner workspace.
    required: false
  dry-run:
    description: Calculate and print the release plan without writing branches, PRs, tags, or releases.
    required: false
    default: 'false'
outputs:
  version:
    description: The version calculated or published by SemVerge.
  release-pr:
    description: URL of the maintained release pull request, when one is created.
  release-url:
    description: URL of the GitHub release, when one is published.
  transaction:
    description: JSON durable release transaction state, including phase, recorded side effects, and recovery details.
  post-release-verification:
    description: JSON post-release verification report generated after a release is published.
  health:
    description: Deprecated alias for the post-release-verification output.
runs:
  using: node20
  main: dist/index.cjs
