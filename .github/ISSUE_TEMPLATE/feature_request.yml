name: Feature request
description: Propose a bounded improvement to the release path
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible release problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Acceptance evidence
      description: Describe the fixture, hosted, provider, or outside-repository proof needed.
    validations:
      required: true
