name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest

  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check generated action bundle
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: git diff --exit-code -- dist/index.cjs dist/index.cjs.map

  required-ci:
    name: required-ci
    if: ${{ always() }}
    needs: [lint, verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all CI jobs to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$CI_RESULTS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$CI_RESULTS"
